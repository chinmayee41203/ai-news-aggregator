# Local development database.
# Start:  docker compose -f docker/docker-compose.yml up -d
# Stop:   docker compose -f docker/docker-compose.yml down        (data is kept)
# Wipe:   docker compose -f docker/docker-compose.yml down -v     (deletes all data)

services:
  postgres:
    image: postgres:17
    container_name: ai-news-aggregator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_news_aggregator
    ports:
      # Host port 5433: a native PostgreSQL service on this PC already uses 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_news_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
