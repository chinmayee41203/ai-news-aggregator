# Every news source the pipeline reads.
# Adding a source = adding one entry. Fields:
#   name     unique id
#   type     rss | google_news | guardian | youtube
#   section  tech | business | politics
#   region   global | india
# plus the type-specific field: url (rss), query + locale (google_news),
# guardian_section (guardian), channels (youtube).
# Optional:
#   publisher: Name   outlet name shown in the email (Google News, Guardian and
#                     YouTube items get it automatically)
#   fetch_content: true   download the transcript / full text in Phase 3
#                         (AI sources only — never for news publishers)

# ---------------- TECH ----------------
- name: nyt_tech
  publisher: The New York Times
  type: rss
  section: tech
  region: global
  url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml

- name: cnn_tech
  type: google_news
  section: tech
  region: global
  query: "site:cnn.com technology"
  locale: us

- name: guardian_tech
  type: guardian
  section: tech
  region: global
  guardian_section: technology

- name: timesnow_tech
  publisher: Times Now
  type: rss
  section: tech
  region: india
  url: https://www.timesnownews.com/feeds/gns-en-technology-science.xml

- name: toi_tech
  type: google_news
  section: tech
  region: india
  query: "site:timesofindia.indiatimes.com/technology"
  locale: in

- name: openai_news
  publisher: OpenAI
  type: rss
  section: tech
  region: global
  url: https://openai.com/news/rss.xml

- name: anthropic_news
  publisher: Anthropic
  type: rss
  section: tech
  region: global
  url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
  fetch_content: true

- name: anthropic_engineering
  publisher: Anthropic
  type: rss
  section: tech
  region: global
  url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml
  fetch_content: true

- name: anthropic_research
  publisher: Anthropic
  type: rss
  section: tech
  region: global
  url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml
  fetch_content: true

- name: ai_youtube
  type: youtube
  section: tech
  region: global
  fetch_content: true
  channels:
    UCn8ujwUInbJkBhffxqAPBVQ: Dave Ebbelaar
    UCawZsQWqfGSbCI5yjkdVkTA: Matthew Berman
    UCNJ1Ymd5yFuUPtn21xtRbbw: AI Explained
    UCbfYPyITQ-7l4upoX8nvctg: Two Minute Papers

